name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-and-test-opensuse:
    name: Build & Test (openSUSE)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          set -eu
          packages="gcc-c++ cmake make pkg-config libopenssl-devel libicu-devel libcurl-devel zlib-devel python3 python3-devel git patch"

          zypper --non-interactive --gpg-auto-import-keys refresh

          # The tumbleweed:latest image often lags behind the repositories by one
          # snapshot, which makes -devel packages unresolvable against the already
          # installed runtime libraries (e.g. libpsl-devel vs libpsl5). Allow the
          # solver to downgrade/change vendor, and fall back to a full dist-upgrade
          # when the package set is still inconsistent.
          if ! zypper --non-interactive install --no-recommends \
                --allow-downgrade --allow-vendor-change --force-resolution $packages; then
            echo "::warning::Package resolution failed, running zypper dup to sync the snapshot"
            zypper --non-interactive --gpg-auto-import-keys dup \
              --no-recommends --allow-downgrade --allow-vendor-change
            zypper --non-interactive install --no-recommends $packages
          fi

      # Integration tests are for local runs only: neither built nor run here.
      - name: Configure
        run: cmake --preset linux-debug -DFILO_BUILD_INTEGRATION_TESTS=OFF

      # Use every core the runner has: at -j2 the build alone took ~43 of the
      # job's minutes and the tests were cancelled before finishing.
      # The log is kept and the compiler's own words are echoed into the job
      # summary: a failed build otherwise says nothing about what broke.
      - name: Build
        run: |
          set +e
          cmake --build --preset linux-debug -j"$(nproc)" 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            {
              echo "### Build failed"
              echo '```'
              grep -E "error:|FAILED:" build.log | head -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$build_status"

      - name: Test
        run: ctest --preset linux-debug --output-on-failure --parallel 4 -LE integration
