name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-and-test-opensuse:
    name: Build & Test (openSUSE)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          set -eu
          packages="gcc-c++ cmake make pkg-config libopenssl-devel libicu-devel libcurl-devel python3 python3-devel git patch"

          zypper --non-interactive --gpg-auto-import-keys refresh

          # The tumbleweed:latest image often lags behind the repositories by one
          # snapshot, which makes -devel packages unresolvable against the already
          # installed runtime libraries (e.g. libpsl-devel vs libpsl5). Allow the
          # solver to downgrade/change vendor, and fall back to a full dist-upgrade
          # when the package set is still inconsistent.
          if ! zypper --non-interactive install --no-recommends \
                --allow-downgrade --allow-vendor-change --force-resolution $packages; then
            echo "::warning::Package resolution failed, running zypper dup to sync the snapshot"
            zypper --non-interactive --gpg-auto-import-keys dup \
              --no-recommends --allow-downgrade --allow-vendor-change
            zypper --non-interactive install --no-recommends $packages
          fi

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug -j2

      - name: Test
        run: ctest --preset linux-debug --output-on-failure --parallel 4
